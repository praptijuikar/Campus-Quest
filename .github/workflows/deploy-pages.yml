name: Deploy Campus Quest to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SDL_VIDEODRIVER: dummy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: python -m pip install pygbag==0.9.3 pygame==2.6.1 pytest

      - name: Run project tests
        run: python -m pytest -q

      - name: Verify character sprites
        run: PYTHONPATH="$GITHUB_WORKSPACE" python tools/verify_runtime_sprites.py

      - name: Build browser game
        run: python -m pygbag --build --cdn https://pygame-web.github.io/archives/0.9/ .

      - name: Validate and stage Pages files
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path
          from zipfile import ZipFile

          def fail(message):
            print(f"::error title=Pages artifact validation::{message}")
            raise SystemExit(message)

          web_dir = Path("build/web")
          app_archive = web_dir / "game.apk"
          required_files = (web_dir / "index.html", app_archive)
          missing_files = [str(path) for path in required_files if not path.is_file() or path.stat().st_size == 0]
          if missing_files:
            fail(f"Missing or empty Pygbag output files: {missing_files}")

          try:
            package = ZipFile(app_archive)
          except Exception as error:
            fail(f"Pygbag app archive is not a valid ZIP: {error}")

          with package:
              names = package.namelist()
              required = (
                  "assets/main.py",
                  "assets/assets/characters/jason/jason_spritesheet.png",
                  "assets/assets/characters/krrish/krrish_spritesheet.png",
              )
              missing = [name for name in required if name not in names]
              excluded = [
                  name for name in names
                  if ".venv/" in name
                  or ".pytest_cache/" in name
                  or name.endswith("game_progress.db")
              ]
              if missing or excluded:
                  fail(f"Invalid game package: missing={missing}, excluded={excluded}")
              corrupt = package.testzip()
              if corrupt:
                  fail(f"Corrupt entry in Pygbag app archive: {corrupt}")
              print(f"Validated Pygbag archive with {len(names)} entries and both character sprites.")

          site_dir = Path("_site")
          site_dir.mkdir(exist_ok=True)
          for source in (web_dir / "index.html", web_dir / "favicon.png", app_archive):
              if source.is_file():
                  shutil.copy2(source, site_dir / source.name)
          (site_dir / ".nojekyll").touch()
          print(f"Pages artifact staged at {site_dir.resolve()}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4